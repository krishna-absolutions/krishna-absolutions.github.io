    <style>
        :root {
            --primary: #0F1E36;
            --secondary: #D4AF37;
            --text: #333333;
            --light: #F8F9FA;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: var(--text); margin: 0; padding: 0; }
        
        /* Header & Nav */
        header { background-color: var(--primary); padding: 15px 0; border-bottom: 3px solid var(--secondary); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { color: white; font-size: 22px; font-weight: bold; text-decoration: none; }
        .logo span { color: var(--secondary); }
        nav { display: flex; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 15px; transition: color 0.3s; white-space: nowrap; }
        nav a:hover, .dropbtn:hover { color: var(--secondary); cursor: pointer; }

        /* Dropdown Styles */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-weight: 500; font-size: 15px; margin-left: 20px; cursor: pointer; }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 220px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            border-radius: 4px;
            top: 100%;
            left: 0;
            padding: 10px 0;
        }
        .dropdown-content a {
            color: var(--primary);
            padding: 12px 16px;
            display: block;
            text-decoration: none;
            font-size: 14px;
            margin-left: 0;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a:hover { background-color: var(--secondary); color: white; }

        /* Main Content */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        h1 { color: var(--primary); }
    </style>
</head>
